name: Deploy Sunny SAI to Vercel
run-name: Vercel production · ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sunny-vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and synchronize encrypted production secrets, then deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node scripts/deploy-vercel.mjs
